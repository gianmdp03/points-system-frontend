<div class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-4 overflow-y-auto animate-fade-in">
  <div (click)="close.emit()" class="absolute inset-0"></div>

  <div class="relative w-full max-w-lg bg-[#FFFFFF] dark:bg-[#1E1E1E] rounded-2xl p-6 sm:p-8 border border-[#E3E3E3] dark:border-[#333333] shadow-lg z-10 max-h-[90vh] overflow-y-auto">
    <button 
      (click)="close.emit()"
      class="absolute top-5 right-5 p-2 text-[#5F6368] hover:text-[#1F1F1F] dark:text-[#9AA0A6] dark:hover:text-white hover:bg-[#F8F9FA] dark:hover:bg-[#131314] rounded-full transition cursor-pointer">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <div class="flex items-center gap-3 mb-6">
      <div class="p-3 bg-[#E8F0FE] dark:bg-[#131314] rounded-2xl text-[#1A73E8] dark:text-[#8AB4F8]">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V5a2 2 0 10-2 2h2zm0 13C10.832 21 2 20 2 12V6a2 2 0 012-2h16a2 2 0 012 2v6c0 8-8.832 9-10 9z" />
        </svg>
      </div>
      <div>
        <h3 class="text-xl font-bold text-[#1F1F1F] dark:text-[#E3E3E3]">Canjear Recompensa</h3>
        <p class="text-xs text-[#5F6368] dark:text-[#9AA0A6]">Ingresa los datos del cliente para descontar los puntos y entregar el premio.</p>
      </div>
    </div>

    <!-- Resumen del Premio a Canjear -->
    <div class="mb-5 p-4 bg-[#F8F9FA] dark:bg-[#131314] rounded-2xl border border-[#E3E3E3] dark:border-[#333333] flex items-center justify-between gap-3">
      <div>
        <span class="text-[10px] font-extrabold uppercase tracking-wider text-[#5F6368] dark:text-[#9AA0A6] block">Premio Seleccionado</span>
        <span class="text-sm font-black text-[#1F1F1F] dark:text-[#E3E3E3]">{{ rewardName }}</span>
      </div>
      <span class="px-3 py-1.5 bg-[#E8F0FE] dark:bg-[#1E293B] border border-[#1A73E8]/20 dark:border-[#8AB4F8]/20 text-[#1A73E8] dark:text-[#8AB4F8] font-black text-xs rounded-full">
        -{{ costInPoints }} Puntos
      </span>
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-3.5 bg-rose-50 dark:bg-rose-950/70 border border-rose-200 dark:border-rose-800 rounded-xl text-xs text-rose-700 dark:text-rose-300 font-semibold flex items-center gap-2">
        <svg class="w-4 h-4 text-rose-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="submitForm.emit()" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-start">
        <div class="w-full">
          <app-country-select 
            formControlName="country"
            label="País"
            [required]="true"
            [hasError]="isFieldInvalid(form, 'country', isSubmitted)"
            [errorMessage]="getFieldError(form, 'country')">
          </app-country-select>
        </div>

        <!-- DNI -->
        <div class="w-full">
          <label class="block text-xs font-bold uppercase tracking-wider text-[#1F1F1F] dark:text-[#E3E3E3] mb-1.5 h-4 leading-4 truncate">DNI del Cliente *</label>
          <input 
            type="text" 
            formControlName="dni" 
            placeholder="Ej. 40123456" 
            [class.border-rose-500]="isFieldInvalid(form, 'dni', isSubmitted)"
            class="w-full h-12 px-4 py-3 bg-[#F8F9FA] dark:bg-[#131314] border border-[#E3E3E3] dark:border-[#333333] rounded-2xl text-sm font-semibold text-[#1F1F1F] dark:text-[#E3E3E3] focus:outline-none focus:border-[#1A73E8] dark:focus:border-[#8AB4F8] transition" />
          @if (isFieldInvalid(form, 'dni', isSubmitted)) {
            <p class="text-rose-500 text-xs mt-1.5 font-medium">{{ getFieldError(form, 'dni') }}</p>
          }
        </div>
      </div>

      <div class="pt-5 border-t border-[#E3E3E3] dark:border-[#333333] flex items-center justify-end gap-3">
        <button 
          type="button"
          (click)="close.emit()"
          class="min-h-[44px] px-5 py-2.5 bg-[#F8F9FA] hover:bg-[#E3E3E3] dark:bg-[#131314] dark:hover:bg-[#333333] text-[#1F1F1F] dark:text-[#E3E3E3] font-bold text-xs rounded-xl transition cursor-pointer border border-[#E3E3E3] dark:border-[#333333]">
          Cancelar
        </button>
        <button 
          type="submit" 
          [disabled]="isLoading"
          class="min-h-[44px] px-6 py-2.5 bg-[#1A73E8] hover:bg-[#1557B0] dark:bg-[#8AB4F8] dark:hover:bg-[#AECBFA] text-white dark:text-[#131314] font-bold text-xs rounded-xl shadow-md transition cursor-pointer flex items-center gap-2 disabled:opacity-60">
          @if (isLoading) {
            <div class="w-4 h-4 border-2 border-white dark:border-[#131314] border-t-transparent rounded-full animate-spin"></div>
            <span>Canjeando...</span>
          } @else {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            <span>Confirmar Canje</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
