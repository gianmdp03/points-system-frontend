<div class="flex items-center gap-2 p-2 bg-[#F8F9FA] dark:bg-[#1E1E1E] rounded-2xl border border-[#C4C7C5] dark:border-[#333333] overflow-x-auto shadow-xs scrollbar-none">
  <button 
    (click)="selectTab.emit('overview')" 
    [class]="activeTab === 'overview' ? 'bg-[#1A73E8] dark:bg-[#8AB4F8] text-white dark:text-[#131314] shadow-xs' : 'text-[#5F6368] dark:text-[#9AA0A6] hover:bg-[#FFFFFF] dark:hover:bg-[#131314]'"
    class="flex-1 min-h-[44px] py-2.5 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap cursor-pointer flex items-center justify-center">
    Resumen General
  </button>
  <button 
    (click)="selectTab.emit('products')" 
    [class]="activeTab === 'products' ? 'bg-[#1A73E8] dark:bg-[#8AB4F8] text-white dark:text-[#131314] shadow-xs' : 'text-[#5F6368] dark:text-[#9AA0A6] hover:bg-[#FFFFFF] dark:hover:bg-[#131314]'"
    class="flex-1 min-h-[44px] py-2.5 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap cursor-pointer flex items-center justify-center gap-2">
    <span>Productos</span>
    <span [class]="activeTab === 'products' ? 'bg-white/20 text-white dark:text-[#131314]' : 'bg-[#C4C7C5] dark:bg-[#333333] text-[#1F1F1F] dark:text-[#E3E3E3]'" class="px-2 py-0.5 rounded-full text-[11px] font-bold">
      {{ productsCount }}
    </span>
  </button>
  <button 
    (click)="selectTab.emit('promotions')" 
    [class]="activeTab === 'promotions' ? 'bg-[#1A73E8] dark:bg-[#8AB4F8] text-white dark:text-[#131314] shadow-xs' : 'text-[#5F6368] dark:text-[#9AA0A6] hover:bg-[#FFFFFF] dark:hover:bg-[#131314]'"
    class="flex-1 min-h-[44px] py-2.5 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap cursor-pointer flex items-center justify-center gap-2">
    <span>Promociones</span>
    <span [class]="activeTab === 'promotions' ? 'bg-white/20 text-white dark:text-[#131314]' : 'bg-[#C4C7C5] dark:bg-[#333333] text-[#1F1F1F] dark:text-[#E3E3E3]'" class="px-2 py-0.5 rounded-full text-[11px] font-bold">
      {{ promotionsCount }}
    </span>
  </button>
  <button 
    (click)="selectTab.emit('rewards')" 
    [class]="activeTab === 'rewards' ? 'bg-[#1A73E8] dark:bg-[#8AB4F8] text-white dark:text-[#131314] shadow-xs' : 'text-[#5F6368] dark:text-[#9AA0A6] hover:bg-[#FFFFFF] dark:hover:bg-[#131314]'"
    class="flex-1 min-h-[44px] py-2.5 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap cursor-pointer flex items-center justify-center gap-2">
    <span>Premios</span>
    <span [class]="activeTab === 'rewards' ? 'bg-white/20 text-white dark:text-[#131314]' : 'bg-[#C4C7C5] dark:bg-[#333333] text-[#1F1F1F] dark:text-[#E3E3E3]'" class="px-2 py-0.5 rounded-full text-[11px] font-bold">
      {{ rewardsCount }}
    </span>
  </button>
  @if (currentRole === RoleEnum.COMPANY_ADMIN || currentRole === RoleEnum.APP_ADMIN) {
    <button 
      (click)="selectTab.emit('sales')" 
      [class]="activeTab === 'sales' ? 'bg-[#1A73E8] dark:bg-[#8AB4F8] text-white dark:text-[#131314]' : 'text-[#5F6368] dark:text-[#9AA0A6] hover:bg-[#FFFFFF] dark:hover:bg-[#131314]'"
      class="flex-1 min-h-[44px] py-2.5 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap cursor-pointer flex items-center justify-center">
      <span>Ventas</span>
    </button>
    <button 
      (click)="selectTab.emit('inactive-clients')" 
      [class]="activeTab === 'inactive-clients' ? 'bg-[#1A73E8] dark:bg-[#8AB4F8] text-white dark:text-[#131314]' : 'text-[#5F6368] dark:text-[#9AA0A6] hover:bg-[#FFFFFF] dark:hover:bg-[#131314]'"
      class="flex-1 min-h-[44px] py-2.5 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap cursor-pointer flex items-center justify-center gap-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>Inactivos</span>
    </button>
    <button 
      (click)="selectTab.emit('templates')" 
      [class]="activeTab === 'templates' ? 'bg-[#1A73E8] dark:bg-[#8AB4F8] text-white dark:text-[#131314]' : 'text-[#5F6368] dark:text-[#9AA0A6] hover:bg-[#FFFFFF] dark:hover:bg-[#131314]'"
      class="flex-1 min-h-[44px] py-2.5 px-4 rounded-xl text-xs sm:text-sm font-extrabold transition-all whitespace-nowrap cursor-pointer flex items-center justify-center gap-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
      </svg>
      <span>Plantillas</span>
      @if (templatesCount > 0) {
        <span [class]="activeTab === 'templates' ? 'bg-white/20 text-white dark:text-[#131314]' : 'bg-[#C4C7C5] dark:bg-[#333333] text-[#1F1F1F] dark:text-[#E3E3E3]'" class="px-2 py-0.5 rounded-full text-[11px] font-bold">
          {{ templatesCount }}
        </span>
      }
    </button>
  }
</div>
