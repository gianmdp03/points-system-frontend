<div class="flex flex-col items-center text-center space-y-5">
  
  <!-- Canvas QR Container -->
  <div class="relative p-3.5 bg-white dark:bg-white rounded-3xl border border-[#C4C7C5] dark:border-[#333333] shadow-md">
    <canvas #qrCanvas width="320" height="320" class="block w-[260px] h-[260px] sm:w-[300px] sm:h-[300px] rounded-2xl"></canvas>
  </div>

  <!-- Info URL -->
  <div class="space-y-1.5 w-full max-w-sm">
    <span class="text-[11px] uppercase font-extrabold tracking-wider text-[#5F6368] dark:text-[#9AA0A6] block">
      Enlace directo de auto-registro
    </span>
    <div class="px-3.5 py-2 bg-[#F8F9FA] dark:bg-[#131314] rounded-xl border border-[#C4C7C5] dark:border-[#333333] text-xs font-mono text-[#1A73E8] dark:text-[#8AB4F8] truncate select-all">
      {{ qrUrl() }}
    </div>
  </div>

  <!-- Botones de Acción: Descargar & Imprimir -->
  <div class="flex flex-col sm:flex-row items-center gap-3 w-full max-w-md pt-2">
    <button
      type="button"
      (click)="downloadQR()"
      class="w-full sm:flex-1 min-h-[44px] px-5 py-3 bg-[#1A73E8] hover:bg-[#1557B0] dark:bg-[#8AB4F8] dark:hover:bg-[#AECBFA] text-white dark:text-[#131314] font-bold text-xs sm:text-sm rounded-full shadow-xs transition flex items-center justify-center gap-2 cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
      </svg>
      Descargar Imagen PNG
    </button>

    <button
      type="button"
      (click)="printQR()"
      class="w-full sm:w-auto min-h-[44px] px-5 py-3 bg-[#FFFFFF] hover:bg-[#F8F9FA] dark:bg-[#1E1E1E] dark:hover:bg-[#333333] text-[#1F1F1F] dark:text-[#E3E3E3] font-bold text-xs sm:text-sm rounded-full border border-[#C4C7C5] dark:border-[#333333] shadow-xs transition flex items-center justify-center gap-2 cursor-pointer">
      <svg class="w-4 h-4 text-[#1A73E8] dark:text-[#8AB4F8]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
      </svg>
      Imprimir Cartel
    </button>
  </div>

</div>
