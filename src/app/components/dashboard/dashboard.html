<section id="mi-panel" class="py-8 my-6 bg-[#F8F9FA] dark:bg-[#1E1E1E] rounded-2xl border border-[#C4C7C5] dark:border-[#333333] p-6 md:p-10 transition-all duration-300">
  
  <!-- Header: badge de conexión, título, rol, login banner, error alert -->
  <app-dashboard-header
    [currentRole]="currentRole()"
    [isLoggedIn]="isLoggedIn()"
    [errorMessage]="errorMessage()"
    (retryLoad)="loadRoleData(currentRole(), 0)">
  </app-dashboard-header>

  <!-- ==================== 1. VISTA ROL: COMPANY_ADMIN ==================== -->
  @if (currentRole() === RoleEnum.COMPANY_ADMIN) {
    <app-role-admin-view
      [companies]="adminCompanies()"
      [isLoading]="isLoading()"
      (addCompany)="openAddCompanyModal()"
      (editCompany)="openEditCompanyModal($event)"
      (toggleStatus)="toggleCompanyStatus($event)">
    </app-role-admin-view>
  }

  <!-- ==================== 2. VISTA ROL: APP_ADMIN ==================== -->
  @if (currentRole() === RoleEnum.APP_ADMIN) {
    <app-role-app-admin-view
      [companies]="allCompanies()"
      [totalElements]="totalElements()"
      [isLoading]="isLoading()"
      (addCompany)="openAddCompanyModal()"
      (editCompany)="openEditCompanyModal($event)"
      (toggleStatus)="toggleCompanyStatus($event)">
    </app-role-app-admin-view>
  }
</section>

<!-- ========================================================================= -->
<!-- MODAL 1: FORMULARIO CREAR COMPAÑÍA -->
<!-- ========================================================================= -->
@if (showAddCompanyModal()) {
  <app-add-company-modal
    [form]="addCompanyForm"
    [isSubmitted]="isAddCompanySubmitted()"
    [errorMessage]="modalErrorMessage()"
    (close)="closeAddCompanyModal()"
    (submitForm)="onAddCompanySubmit()">
  </app-add-company-modal>
}

<!-- ========================================================================= -->
<!-- MODAL 2: FORMULARIO EDITAR COMPAÑÍA -->
<!-- ========================================================================= -->
@if (showEditCompanyModal()) {
  <app-dashboard-edit-company-modal
    [form]="editCompanyForm"
    [isSubmitted]="isEditCompanySubmitted()"
    [errorMessage]="modalErrorMessage()"
    (close)="closeEditCompanyModal()"
    (submitForm)="onEditCompanySubmit()">
  </app-dashboard-edit-company-modal>
}
